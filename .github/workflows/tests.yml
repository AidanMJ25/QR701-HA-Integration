name: Tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install serialx==1.15.1 ruff pytest pytest-asyncio pytest-homeassistant-custom-component
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: python -m unittest discover -s tests -p 'test_standalone.py' -v
      - run: pytest tests/test_integration.py -v
